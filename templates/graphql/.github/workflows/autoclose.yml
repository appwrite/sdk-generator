name: Auto-close External Pull Requests

on:
  pull_request_target:
    types: [opened, reopened]

jobs:
  auto_close:
    if: github.head_ref != 'dev'
    uses: appwrite/.github/.github/workflows/autoclose.yml@64fd49cd3f28d624d3908b4093b238e9a1023f58 # main
    secrets:
      GH_AUTO_CLOSE_PR_TOKEN: ${{ secrets.GH_AUTO_CLOSE_PR_TOKEN }}
