name: CI

# Every job here builds, tests or lints and writes nothing back to the repo.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  tests:
    name: Tests / ${{ matrix.sdk }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.5']
        sdk: [
          Android5Java17,
          Android16Java17,
          CLIBun10,
          CLIBun11,
          CLIBun13,
          GoCLI126,
          DartBeta,
          DartStable,
          DotNet60,
          DotNet80,
          DotNet90,
          FlutterStable,
          FlutterBeta,
          Go112,
          Go118,
          KotlinJava17,
          Node26,
          Node18,
          Node20,
          PHP82,
          PHP83,
          Python39,
          Python310,
          Python311,
          Python312,
          Python313,
          Ruby27,
          Ruby30,
          Ruby31,
          Rust183,
          AppleSwift61,
          Swift61,
          Unity2021,
          WebChromium,
          WebNode,
          ReactNative
        ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Setup PHP with PECL extension
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: curl

      - name: Before Install
        run: |
          if [ ! -z "${DOCKERHUB_PULL_USERNAME:-}" ]; then
            echo "${DOCKERHUB_PULL_PASSWORD}" | docker login --username "${DOCKERHUB_PULL_USERNAME}" --password-stdin
          fi

      - name: Install
        run: |
          docker --version
          composer install

      - name: Run Tests
        env:
          UNITY_LICENSE: ${{ matrix.sdk == 'Unity2021' && secrets.UNITY_LICENSE || '' }}
        run: composer test tests/e2e/${{ matrix.sdk }}Test.php

  unit:
    name: Tests / Unit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP with PECL extension
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: curl

      - name: Install
        run: composer install

      - name: Run Unit Tests
        run: composer test -- --testsuite Unit

  lint:
    name: Checks / Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP with PECL extension
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: curl

      - name: Install
        run: composer install

      - name: Lint
        run: composer lint

  refactor:
    name: Checks / Refactor
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP with PECL extension
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: curl

      - name: Install
        run: composer install

      - name: Run Rector
        run: composer refactor:check

  twig-lint:
    name: Checks / Twig
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Run djLint
        # Pinned: djlint 1.41.0+ false-positives T038 on multi-line {% if %} tags
        run: uvx djlint==1.40.10 templates/ --lint

  go-cli:
    name: Checks / Go CLI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP with PECL extension
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: curl

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'

      - name: Install
        run: composer install

      # The real spec, not tests/resources: both the startup guard and the
      # command surface contract are only worth anything against the full
      # command tree. This is also the only job that generates with
      # `sdk.test` false, which is what makes the surface test exist at all --
      # under the e2e suite it renders to an empty package.
      - name: Generate the Go CLI and the SDK it builds against
        run: |
          php example.php go
          php example.php go-cli

      - name: Build
        working-directory: examples/go-cli
        run: |
          go mod tidy
          go build -ldflags="-s -w" -o appwrite .

      - name: Vet
        working-directory: examples/go-cli
        run: go vet ./...

      # The templates emit gofmt-clean Go, including the struct-literal
      # alignment that varies with which optional fields a command has. Without
      # this the shipped repository drifts and every contributor who formats on
      # save produces an unrelated diff.
      - name: Check formatting
        working-directory: examples/go-cli
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these generated files are not gofmt-clean:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      # Guards every command path, hidden flag and flag name against the
      # TypeScript contract. Regenerate the contract with
      # `node scripts/go-cli/extract-command-surface.mjs` when the spec adds
      # commands -- a failure here means the two CLIs have drifted, not that
      # the test is stale.
      - name: Check the command surface against the TypeScript contract
        working-directory: examples/go-cli
        run: go test ./internal/cmd/ -run 'TestCommandSurfaceMatchesTypeScript|TestContractIsNotEmpty'

      # -race is the point, not a bonus. `push` shares one client across eight
      # concurrent chunk uploads, and that class of bug is invisible without the
      # detector: the tree built and its tests passed for months with an
      # unsynchronised write to the session cookie on that exact path.
      #
      # This is also the only job that runs the whole suite against the real
      # spec. The e2e generates with sdk.test true, where several packages render
      # differently, so a failure here is one no other job can see.
      - name: Test
        working-directory: examples/go-cli
        run: go test -race ./internal/...

  max-line-length:
    name: Checks / Twig line length
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Make script executable
        run: chmod +x ./.github/scripts/max-line-length.sh

      - name: Check max lines
        run: ./.github/scripts/max-line-length.sh . 1200 "*.twig"
