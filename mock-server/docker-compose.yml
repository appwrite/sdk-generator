services:
  mockapi:
    container_name: mockapi
    build:
      context: .
      args:
        DEBUG: "false"
        TESTING: "true"
        VERSION: "dev"
    entrypoint:
      - php
      - -e
      - app/http.php
    volumes:
      - ./app:/usr/src/code/app
      - ./src:/usr/src/code/src
      - mockapi-cache:/storage/cache
    networks:
      - mockapi

  # The MQTT broker (app/mqtt.php) runs from the same image as the HTTP mock but loads its
  # own vendor (./vendor-mqtt, see the Dockerfile): the current utopia-php/mqtt needs
  # utopia-php/telemetry ^0.4, which conflicts with the HTTP mock's utopia-php/framework. It
  # serves both transports the library ships — plain TCP (1883) for the native SDKs and
  # WebSocket (8083) for the browser SDK.
  mqtt:
    container_name: mqtt
    build:
      context: .
      args:
        DEBUG: "false"
        TESTING: "true"
        VERSION: "dev"
    entrypoint:
      - php
      - app/mqtt.php
    volumes:
      - ./app:/usr/src/code/app
    ports:
      - "1883:1883"
      - "8083:8083"
    networks:
      - mockapi

networks:
  mockapi:
    name: mockapi

volumes:
  mockapi-cache: